<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpeaksLow Wallet</title>
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SpeaksLow Wallet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#14181f;--muted:#667085;--line:#e3e7ee;--accent:#0b7a5b;--out:#c2392b;--in:#0b7a5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#181e26;--text:#eef1f5;--muted:#93a0b2;--line:#2a323d;--accent:#2fd0a0;--out:#ff7b6b;--in:#2fd0a0}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#181e26;--text:#eef1f5;--muted:#93a0b2;--line:#2a323d;--accent:#2fd0a0;--out:#ff7b6b;--in:#2fd0a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:92px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.hero{padding:20px}
.lbl{color:var(--muted);font-size:13px}
.bal{font-size:clamp(24px,7vw,38px);font-weight:700;margin:6px 0 2px;word-break:break-all;letter-spacing:-.5px}
h2{font-size:15px;margin:0 0 10px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--text);margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;flex:1;min-width:84px;font-family:inherit}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
button.out{background:var(--out)}
button:active{opacity:.8}
.chips button{flex:none;min-width:0;padding:8px 12px;font-size:13px}
.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.r{text-align:right;font-weight:600;word-break:break-all}
.in{color:var(--in)}.outc{color:var(--out)}
.av{font-size:26px;margin-right:10px}
.grow{flex:1;min-width:0}
.acts{display:flex;gap:6px;margin-top:8px}
.acts button{padding:8px 10px;font-size:13px;min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{background:none;color:var(--muted);flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 0;border:0}
.tabs button.on{color:var(--accent)}
.tabs i{font-style:normal;font-size:20px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:10}
#sheet.show{display:flex}
#sheet .box{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;display:none;max-width:90%}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:16px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="badge">🎮 Simulador · dinheiro fictício</span><span class="badge" id="who-b"></span></div>
  <div id="app"></div>
  <p class="foot">Aplicativo de simulação. Valores, preços e imóveis são fictícios e não têm ligação com nenhum banco ou corretora.</p>
</div>
<div class="tabs" id="tabs"></div>
<div id="sheet"><div class="box" id="sbox"></div></div>
<div id="toast"></div>
<script>
(function(){
var KEY="conta-espelho-v2";
var ASSETS=[
{id:"btc",n:"Bitcoin",s:"BTC",cat:"cripto",p:78218.91,v:.003,live:1,cur:"US$"},
{id:"eth",n:"Ethereum",s:"ETH",cat:"cripto",p:2268.56,v:.004,live:1,cur:"US$"},
{id:"sol",n:"Solana",s:"SOL",cat:"cripto",p:95.62,v:.006,live:1,cur:"US$"},
{id:"doge",n:"Dogecoin",s:"DOGE",cat:"cripto",p:.0758,v:.008,live:1,cur:"US$"},
{id:"petr",n:"Petrobras",s:"PETR4",cat:"bolsa",p:52.71,v:.004,live:1},
{id:"vale",n:"Vale",s:"VALE3",cat:"bolsa",p:62.02,v:.004,live:1},
{id:"itub",n:"Itaú Unibanco",s:"ITUB4",cat:"bolsa",p:38.69,v:.004,live:1},
{id:"aapl",n:"Apple",s:"AAPL",cat:"bolsa",p:344.63,v:.004,live:1,cur:"US$"},
{id:"nvda",n:"Nvidia",s:"NVDA",cat:"bolsa",p:204.64,v:.006,live:1,cur:"US$"},
{id:"verde",n:"Startup Verde",s:"Empresa",cat:"empresas",p:250,v:.06},
{id:"pad",n:"Padaria do Zé",s:"Empresa",cat:"empresas",p:40,v:.02},
{id:"tech",n:"Tech Nova Ltda",s:"Empresa",cat:"empresas",p:3200,v:.04},
{id:"orb",n:"Órbita Aeroespacial",s:"Empresa",cat:"empresas",p:15000,v:.08}];
var PROPS=[
{id:"kit",n:"Kitnet",em:"🏠",p:180000,r:1200},
{id:"apt",n:"Apartamento 2 quartos",em:"🏢",p:650000,r:4500},
{id:"casa",n:"Casa de condomínio",em:"🏡",p:1200000,r:9000},
{id:"cob",n:"Cobertura duplex",em:"🌆",p:4500000,r:38000},
{id:"man",n:"Mansão à beira-mar",em:"🏖️",p:25000000,r:220000},
{id:"edi",n:"Edifício comercial",em:"🏬",p:120000000,r:1400000},
{id:"ilha",n:"Ilha privada",em:"🏝️",p:900000000,r:9000000}];
var EMS=["😀","😎","🤑","🦊","🐯","🚀","👑","🧠"];
var ui={tab:"home",cat:"todos",sheet:null,conf:null,edit:null,real:true};
var timer=null;
var st=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function uid(){return "p"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}
function accNo(){return "Ag. 0001 · Conta "+Math.floor(10000+Math.random()*89999)+"-"+Math.floor(Math.random()*10)}
function mk(name,em){return{id:uid(),name:name,em:em,bal:"0",tx:[],props:{},inv:{},rentAcc:"0",last:Date.now(),acc:accNo()}}
function init(){
  try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.prof&&o.prof.length){st=o}}}catch(e){}
  if(!st){
    var p=mk("Perfil principal",EMS[0]);
    try{var old=localStorage.getItem("conta-espelho-v1");if(old){var q=JSON.parse(old);p.bal=q.bal||"0";p.acc=q.acc||p.acc;p.tx=(q.tx||[]).map(function(x){return{k:x.t==="dep"?"in":"out",c:x.c,n:x.n,d:x.d}})}}catch(e){}
    st={prof:[p],act:p.id,prices:{},chg:{}};
  }
  st.prices=st.prices||{};st.chg=st.chg||{};
  ASSETS.forEach(function(a){if(!st.prices[a.id]||a.live)st.prices[a.id]=a.p;if(a.live)st.chg[a.id]=0});
  if(!st.prof.some(function(x){return x.id===st.act}))st.act=st.prof[0].id;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function cur(){return st.prof.filter(function(x){return x.id===st.act})[0]}
function fmt(c){var neg=c<0n;if(neg)c=-c;return(neg?"-":"")+"R$ "+(c/100n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+String(c%100n).padStart(2,"0")}
function cstr(c){return(c/100n).toString()+","+String(c%100n).padStart(2,"0")}
function parse(t){
  t=String(t).replace(/[^\d.,]/g,"");if(!t)return null;
  var ip,fp="";
  if(t.indexOf(",")>-1){var k=t.lastIndexOf(",");ip=t.slice(0,k).replace(/[.,]/g,"");fp=t.slice(k+1).replace(/[.,]/g,"")}
  else{var pr=t.split(".");if(pr.length===2&&pr[1].length<=2){ip=pr[0];fp=pr[1]}else ip=pr.join("")}
  if(!ip)ip="0";fp=(fp+"00").slice(0,2);
  try{return BigInt(ip)*100n+BigInt(fp)}catch(e){return null}
}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},2200)}
function addTx(p,k,c,n){p.tx.unshift({k:k,c:c.toString(),n:n,d:Date.now()});if(p.tx.length>150)p.tx.length=150}
function asset(id){return ASSETS.filter(function(a){return a.id===id})[0]}
function prop(id){return PROPS.filter(function(a){return a.id===id})[0]}
function hv(h,id){var v=h.u*st.prices[id]*100;return isFinite(v)?BigInt(Math.round(v)):0n}
function rentMin(p){var s=0n;PROPS.forEach(function(x){var q=p.props[x.id]||0;if(q)s+=BigInt(q)*BigInt(x.r)*100n});return s}
function pending(p){var el=Math.max(0,Math.floor((Date.now()-p.last)/1000));return BigInt(p.rentAcc)+rentMin(p)*BigInt(el)/60n}
function accrue(p){p.rentAcc=pending(p).toString();p.last=Date.now()}
function invTot(p){var v=0n,c=0n;for(var id in p.inv){v+=hv(p.inv[id],id);c+=BigInt(p.inv[id].cost)}return{v:v,c:c}}
function propVal(p){var s=0n;PROPS.forEach(function(x){s+=BigInt(p.props[x.id]||0)*BigInt(x.p)*100n});return s}
function worth(p){return BigInt(p.bal)+propVal(p)+invTot(p).v}

function vHome(p){
  var h='<div class="hero"><div class="lbl">Conta espelho · saldo disponível</div><div class="bal">'+fmt(BigInt(p.bal))+'</div><div class="lbl">Patrimônio total: <b id="nw">'+fmt(worth(p))+'</b></div><div class="lbl">'+esc(p.acc)+'</div></div>';
  h+='<div class="card"><h2>Valor da operação</h2><input id="val" inputmode="decimal" placeholder="Ex.: 1500,50 (sem limite)" autocomplete="off"><input id="who" placeholder="Destinatário fictício (para transferir)" autocomplete="off"><div class="row"><button data-a="dep">Depositar</button><button class="out" data-a="wd">Sacar</button><button class="sec" data-a="tr">Transferir</button></div></div>';
  h+='<div class="card"><h2>Adicionar rápido</h2><div class="row chips">';
  [["+ R$ 1.000","1000"],["+ R$ 1 milhão","1000000"],["+ R$ 1 bilhão","1000000000"],["+ R$ 1 trilhão","1000000000000"],["+ R$ 1 quatrilhão","1000000000000000"],["+ R$ 1 sextilhão","1000000000000000000000"]].forEach(function(a){h+='<button class="sec" data-a="quick" data-v="'+a[1]+'">'+a[0]+'</button>'});
  h+='</div></div><div class="card"><h2>Extrato</h2>';
  if(!p.tx.length)h+='<div class="lbl">Nenhuma movimentação ainda.</div>';
  p.tx.slice(0,50).forEach(function(x){var o=x.k==="out";h+='<div class="item"><div class="grow">'+esc(x.n)+'<small>'+new Date(x.d).toLocaleString("pt-BR")+'</small></div><div class="r '+(o?"outc":"in")+'">'+(o?"− ":"+ ")+fmt(BigInt(x.c))+'</div></div>'});
  h+='<div class="row" style="margin-top:12px"><button class="sec" data-a="reset">'+(ui.conf==="reset"?"Confirmar: zerar tudo deste perfil?":"Zerar este perfil")+'</button></div></div>';
  return h;
}
function vProd(p){
  var rm=rentMin(p);
  var h='<div class="hero"><div class="lbl">Aluguéis a receber</div><div class="bal" id="pend">'+fmt(pending(p))+'</div><div class="lbl">Renda: '+fmt(rm)+' por mês (1 mês = 1 minuto no simulador)</div><div class="row" style="margin-top:12px"><button data-a="cpend">Coletar aluguéis</button></div></div>';
  h+='<div class="card"><h2>Imóveis à venda</h2>';
  PROPS.forEach(function(x){
    var q=p.props[x.id]||0;
    h+='<div class="item"><span class="av">'+x.em+'</span><div class="grow"><b>'+x.n+'</b><small>'+fmt(BigInt(x.p)*100n)+' · aluguel '+fmt(BigInt(x.r)*100n)+'/mês</small><small>Você tem: <b>'+q+'</b></small><div class="acts"><button data-a="bprop" data-id="'+x.id+'" data-n="1">Comprar</button><button data-a="bprop" data-id="'+x.id+'" data-n="10">x10</button>'+(q?'<button class="sec" data-a="sprop" data-id="'+x.id+'">Vender 1 (90%)</button>':'')+'</div></div></div>';
  });
  return h+'</div>';
}
function vInv(p){
  var t=invTot(p),pl=t.v-t.c;
  var h='<div class="hero"><div class="lbl">Total investido (valor atual)</div><div class="bal" id="isum">'+fmt(t.v)+'</div><div class="lbl" id="ipl">Resultado: '+(pl<0n?"−":"+")+" "+fmt(pl<0n?-pl:pl)+'</div></div>';
  h+='<div class="card"><div class="row chips">';
  ["todos","cripto","bolsa","empresas"].forEach(function(c){h+='<button class="sec'+(ui.cat===c?" on":"")+'" data-a="cat" data-id="'+c+'">'+c[0].toUpperCase()+c.slice(1)+'</button>'});
  h+='</div><div class="lbl" style="margin-top:10px">Cripto e bolsa: cotação real (consulta de 01/11/2026) nos primeiros 3 s ao abrir esta aba; depois, valores fictícios. Cotações em US$ valem 1:1 em R$ no simulador.</div></div><div class="card">';
  ASSETS.filter(function(a){return ui.cat==="todos"||a.cat===ui.cat}).forEach(function(a){
    var hd=p.inv[a.id];
    h+='<div class="item" data-a="open" data-id="'+a.id+'" style="cursor:pointer"><div class="grow"><b>'+a.n+'</b><small>'+a.s+' · '+a.cat+'</small><small id="hv-'+a.id+'">'+(hd?"Posição: "+fmt(hv(hd,a.id)):"")+'</small></div><div class="r"><span id="pr-'+a.id+'">'+fmtP(a)+'</span><small id="ch-'+a.id+'" class="'+chc(a)+'">'+chs(a)+'</small></div></div>';
  });
  return h+'</div>';
}
function fmtP(a){var p=st.prices[a.id];return(a.cur||"R$")+" "+p.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:p<1?4:3})}
function chs(a){if(ui.real&&a.live)return"● cotação real";var c=st.chg[a.id]||0;return(c>=0?"▲ ":"▼ ")+Math.abs(c).toFixed(3)+"%"}
function chc(a){if(ui.real&&a.live)return"";return(st.chg[a.id]||0)>=0?"in":"outc"}
function startReal(){ASSETS.forEach(function(a){if(a.live){st.prices[a.id]=a.p;st.chg[a.id]=0}});ui.real=true;save();clearInterval(timer);timer=setInterval(tick,3000)}
function vProf(){
  var h='<div class="card"><h2>Novo perfil</h2><input id="pn" placeholder="Nome do perfil" autocomplete="off"><div class="row"><button data-a="mk">Criar perfil</button></div></div><div class="card"><h2>Seus perfis</h2>';
  st.prof.forEach(function(p){
    var act=p.id===st.act;
    h+='<div class="item"><span class="av">'+p.em+'</span><div class="grow">';
    if(ui.edit===p.id)h+='<input id="rn" value="'+esc(p.name)+'" style="margin:0 0 6px">';else h+='<b>'+esc(p.name)+'</b>'+(act?' <span class="badge">ativo</span>':'');
    h+='<small>Patrimônio: '+fmt(worth(p))+'</small><div class="acts">';
    if(ui.edit===p.id)h+='<button data-a="saveren" data-id="'+p.id+'">Salvar</button>';
    else{
      if(!act)h+='<button data-a="use" data-id="'+p.id+'">Usar</button>';
      h+='<button class="sec" data-a="ren" data-id="'+p.id+'">Renomear</button>';
      if(st.prof.length>1)h+='<button class="out" data-a="del" data-id="'+p.id+'">'+(ui.conf==="del"+p.id?"Confirmar?":"Excluir")+'</button>';
    }
    h+='</div></div></div>';
  });
  h+='</div><div class="card"><h2>Instalar como app</h2>'+instHtml();
  return h+'</div>';
}
function render(){
  var p=cur();
  $("who-b").textContent=p.em+" "+p.name;
  $("app").innerHTML=ui.tab==="home"?vHome(p):ui.tab==="prod"?vProd(p):ui.tab==="inv"?vInv(p):vProf();
  var T=[["home","🏠","Home"],["prod","🏢","Products"],["inv","📈","Investments"],["prof","👤","Profiles"]];
  $("tabs").innerHTML=T.map(function(t){return'<button class="'+(ui.tab===t[0]?"on":"")+'" data-a="tab" data-id="'+t[0]+'"><i>'+t[1]+'</i>'+t[2]+'</button>'}).join("");
}
function openSheet(id){
  var a=asset(id),p=cur(),hd=p.inv[id];ui.sheet=id;
  $("sbox").innerHTML='<h2>'+a.n+' · '+fmtP(a)+'</h2><div class="lbl" style="margin-bottom:8px">Saldo: '+fmt(BigInt(p.bal))+' · Posição: '+fmt(hd?hv(hd,id):0n)+'</div><input id="amt" inputmode="decimal" placeholder="Valor em R$" autocomplete="off"><div class="row"><button data-a="buy">Comprar</button><button class="out" data-a="sell">Vender</button></div><div class="row" style="margin-top:8px"><button class="sec" data-a="maxb">Máx. compra</button><button class="sec" data-a="maxs">Vender tudo</button><button class="sec" data-a="close">Fechar</button></div>';
  $("sheet").classList.add("show");
}
function closeSheet(){ui.sheet=null;$("sheet").classList.remove("show")}
function getVal(id){var c=parse($(id).value);if(c===null||c<=0n){toast("Digite um valor maior que zero.");return null}return c}
function trade(buy){
  var p=cur(),id=ui.sheet,a=asset(id),c=getVal("amt");if(c===null)return;
  var price=st.prices[id];
  if(buy){
    if(c>BigInt(p.bal)){toast("Saldo insuficiente.");return}
    var h=p.inv[id]||{u:0,cost:"0"};
    h.u+=Number(c)/100/price;h.cost=(BigInt(h.cost)+c).toString();p.inv[id]=h;
    p.bal=(BigInt(p.bal)-c).toString();addTx(p,"out",c,"Compra de "+a.n);
  }else{
    var hd=p.inv[id];if(!hd){toast("Você não tem este ativo.");return}
    var val=hv(hd,id),frac=c>=val?1:Number(c)/Number(val),got=frac===1?val:c;
    if(frac===1)delete p.inv[id];
    else{hd.u*=1-frac;hd.cost=(BigInt(hd.cost)-BigInt(hd.cost)*BigInt(Math.round(frac*1e9))/1000000000n).toString()}
    p.bal=(BigInt(p.bal)+got).toString();addTx(p,"in",got,"Venda de "+a.n);
  }
  save();closeSheet();render();
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");if(!t)return;
  var a=t.dataset.a,id=t.dataset.id,p=cur(),c;
  if(a!=="reset"&&a!=="del")ui.conf=null;
  switch(a){
  case"inst":if(deferred){deferred.prompt();deferred=null}render();return;
  case"tab":ui.tab=id;ui.edit=null;if(id==="inv")startReal();render();window.scrollTo(0,0);return;
  case"dep":c=getVal("val");if(c===null)return;p.bal=(BigInt(p.bal)+c).toString();addTx(p,"in",c,"Depósito");break;
  case"wd":c=getVal("val");if(c===null)return;if(c>BigInt(p.bal)){toast("Saldo insuficiente.");return}p.bal=(BigInt(p.bal)-c).toString();addTx(p,"out",c,"Saque");break;
  case"tr":c=getVal("val");if(c===null)return;var w=$("who").value.trim();if(!w){toast("Informe o destinatário.");return}
    if(c>BigInt(p.bal)){toast("Saldo insuficiente.");return}p.bal=(BigInt(p.bal)-c).toString();addTx(p,"out",c,"Transferência para "+w);break;
  case"quick":c=BigInt(t.dataset.v)*100n;p.bal=(BigInt(p.bal)+c).toString();addTx(p,"in",c,"Depósito rápido");break;
  case"reset":if(ui.conf!=="reset"){ui.conf="reset";render();return}
    p.bal="0";p.tx=[];p.props={};p.inv={};p.rentAcc="0";p.last=Date.now();ui.conf=null;break;
  case"cpend":accrue(p);c=BigInt(p.rentAcc);if(c<=0n){toast("Nenhum aluguel para coletar.");return}
    p.bal=(BigInt(p.bal)+c).toString();p.rentAcc="0";addTx(p,"in",c,"Aluguéis recebidos");break;
  case"bprop":var x=prop(id),n=Number(t.dataset.n),cost=BigInt(x.p)*100n*BigInt(n);
    if(cost>BigInt(p.bal)){toast("Saldo insuficiente.");return}
    accrue(p);p.bal=(BigInt(p.bal)-cost).toString();p.props[id]=(p.props[id]||0)+n;addTx(p,"out",cost,"Compra: "+n+"x "+x.n);break;
  case"sprop":var y=prop(id);if(!p.props[id])return;accrue(p);c=BigInt(y.p)*90n;
    p.props[id]--;if(!p.props[id])delete p.props[id];p.bal=(BigInt(p.bal)+c).toString();addTx(p,"in",c,"Venda: "+y.n);break;
  case"cat":ui.cat=id;render();return;
  case"open":openSheet(id);return;
  case"buy":trade(true);return;
  case"sell":trade(false);return;
  case"maxb":$("amt").value=cstr(BigInt(p.bal));return;
  case"maxs":var hh=p.inv[ui.sheet];$("amt").value=hh?cstr(hv(hh,ui.sheet)):"";return;
  case"close":closeSheet();return;
  case"use":st.act=id;break;
  case"ren":ui.edit=id;render();return;
  case"saveren":var nm=$("rn").value.trim();if(!nm){toast("Informe um nome.");return}
    st.prof.forEach(function(q){if(q.id===id)q.name=nm});ui.edit=null;break;
  case"del":if(ui.conf!=="del"+id){ui.conf="del"+id;render();return}
    st.prof=st.prof.filter(function(q){return q.id!==id});if(st.act===id)st.act=st.prof[0].id;ui.conf=null;break;
  case"mk":var nn=$("pn").value.trim();if(!nn){toast("Informe um nome.");return}
    var np=mk(nn,EMS[st.prof.length%EMS.length]);st.prof.push(np);st.act=np.id;toast("Perfil criado e ativado.");break;
  }
  save();render();
});
$("sheet").addEventListener("click",function(e){if(e.target===$("sheet"))closeSheet()});
function tick(){ui.real=false;
  ASSETS.forEach(function(a){
    var r=(Math.random()-.495)*2*a.v;
    st.prices[a.id]=Math.max(.01,st.prices[a.id]*(1+r));st.chg[a.id]=r*100;
  });
  save();var p=cur();
  if(ui.tab==="home"&&$("nw"))$("nw").textContent=fmt(worth(p));
  if(ui.tab==="prod"&&$("pend"))$("pend").textContent=fmt(pending(p));
  if(ui.tab==="inv"){
    ASSETS.forEach(function(a){
      var e=$("pr-"+a.id);if(!e)return;
      e.textContent=fmtP(a);var c=$("ch-"+a.id);c.textContent=chs(a);c.className=chc(a);
      var hd=p.inv[a.id];$("hv-"+a.id).textContent=hd?"Posição: "+fmt(hv(hd,a.id)):"";
    });
    var t=invTot(p),pl=t.v-t.c;$("isum").textContent=fmt(t.v);$("ipl").textContent="Resultado: "+(pl<0n?"−":"+")+" "+fmt(pl<0n?-pl:pl);
  }
}
var deferred=null;
function isApp(){return(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true}
function instHtml(){
  if(isApp())return'<div class="lbl">O app já está instalado neste aparelho.</div>';
  var h='<div class="lbl" style="margin-bottom:10px">Instale para abrir em tela cheia, com ícone na tela inicial.</div>';
  if(deferred)return h+'<div class="row"><button data-a="inst">Instalar agora</button></div>';
  return h+'<div class="lbl">iPhone (Safari): Compartilhar → Adicionar à Tela de Início.<br>Android (Chrome): menu ⋮ → Instalar app ou Adicionar à tela inicial.<br>Abra o link direto no navegador, fora do app do Claude, para a opção aparecer.</div>';
}
function icon(sz){
  var c=document.createElement("canvas");c.width=c.height=sz;var x=c.getContext("2d");x.scale(sz/1024,sz/1024);
  function rr(a,b,w,h,r,f){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();x.fillStyle=f;x.fill()}
  x.fillStyle="#111318";x.fillRect(0,0,1024,1024);
  ["#ff453a","#ff9f0a","#30d158","#0a84ff"].forEach(function(f,i){var w=560+40*i;rr((1024-w)/2,150+65*i,w,380,44,f)});
  rr(132,470,760,420,90,"#2a2d36");x.strokeStyle="#4a4f5c";x.lineWidth=8;x.stroke();
  rr(457,575,110,200,55,"#fff");
  x.strokeStyle="#fff";x.lineWidth=22;x.lineCap="round";x.beginPath();x.arc(512,690,100,0,Math.PI,false);x.stroke();
  x.beginPath();x.moveTo(512,790);x.lineTo(512,832);x.moveTo(452,832);x.lineTo(572,832);x.stroke();
  return c.toDataURL("image/png")}
function setupPwa(){
  try{if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}
  if(document.querySelector('link[rel="manifest"]'))return;
  try{
    var i192=icon(192),i512=icon(512);
    var a=document.createElement("link");a.rel="apple-touch-icon";a.href=icon(180);document.head.appendChild(a);
    var f=document.createElement("link");f.rel="icon";f.href=i192;document.head.appendChild(f);
    var m={name:"SpeaksLow Wallet",short_name:"SpeaksLow",start_url:location.href.split("#")[0],display:"standalone",background_color:"#111318",theme_color:"#111318",lang:"pt-BR",icons:[{src:i192,sizes:"192x192",type:"image/png"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any"}]};
    var l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(l);
  }catch(e){}
}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;if(ui.tab==="prof")render()});
init();setupPwa();render();timer=setInterval(tick,3000);
setInterval(function(){var p=cur();if(ui.tab==="prod"&&$("pend"))$("pend").textContent=fmt(pending(p))},1000);
})();
</script>
